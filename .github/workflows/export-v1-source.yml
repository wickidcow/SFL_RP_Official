name: Export Legacy Source Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-v1-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact v1.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/wickidcow/SFL_RP_Official/releases/download/v1.0.1/SlimefunLegacyRP.zip" \
            --output SlimefunLegacyRP-v1.0.1.zip
          echo "c2c08909186ab96a2eeb14e825de92db06ffb9c2b87399feefc05df3506f15cd  SlimefunLegacyRP-v1.0.1.zip" | sha256sum --check -
          unzip -t SlimefunLegacyRP-v1.0.1.zip
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: sfl-rp-v1-source
          path: SlimefunLegacyRP-v1.0.1.zip
          if-no-files-found: error
          retention-days: 7
