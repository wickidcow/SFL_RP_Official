name: Test resource-pack tools

on:
  pull_request:
    paths:
      - 'tools/**'
      - '.github/workflows/test-pack-tools.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/test-pack-tools.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_*.py'
