name: Diagnose talisman resource-pack mappings

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-talisman-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download published pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/wickidcow/SFL_RP_Official/releases/download/v3.0.0/SlimefunLegacyRP.zip" \
            --output pack.zip
          unzip -tq pack.zip

      - name: Trace effective 26.3 overlays
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import json, zipfile

          MODELS = {
            "miner": "slimefun/talisman1/miner",
            "knight": "slimefun/talisman1/knight",
            "caveman": "slimefun/talisman1/caveman",
            "wise": "slimefun/talisman1/wise",
            "farmer": "slimefun/talisman1/farmer",
          }

          def jload(zf, path):
              try:
                  return json.loads(zf.read(path).decode("utf-8"))
              except Exception:
                  return None

          def overlays(meta):
              out = [""]
              for entry in meta.get("overlays", {}).get("entries", []):
                  # 26.3 reports format 97.1 in this pack.
                  mn = entry.get("min_format")
                  mx = entry.get("max_format")
                  def asnum(v):
                      if isinstance(v, list):
                          return float(f"{v[0]}.{v[1]}")
                      try: return float(v)
                      except Exception: return None
                  lo, hi = asnum(mn), asnum(mx)
                  if lo is not None and hi is not None and lo <= 97.1 <= hi:
                      out.append(entry["directory"])
              return out

          def pref(d, p):
              return f"{d}/{p}" if d else p

          with zipfile.ZipFile("pack.zip") as zf:
              names=set(zf.namelist())
              meta=jload(zf,"pack.mcmeta") or {}
              active=overlays(meta)
              report={"active_26_3_dirs":active,"models":{},"atlases":{}}

              for label, logical in MODELS.items():
                  rel=f"assets/slimefun/models/{logical}.json"
                  copies=[]
                  effective=None
                  for d in active:
                      path=pref(d,rel)
                      if path in names:
                          data=jload(zf,path)
                          copies.append({"dir":d or "<root>","path":path,"json":data})
                          effective={"dir":d or "<root>","path":path,"json":data}
                  report["models"][label]={"copies":copies,"effective":effective}

              # Exact source/sprite registration for each tested texture in every active items atlas.
              for d in active:
                  atlas_path=pref(d,"assets/minecraft/atlases/items.json")
                  if atlas_path not in names:
                      continue
                  atlas=jload(zf,atlas_path) or {}
                  matches={}
                  for label, logical in MODELS.items():
                      resource=f"slimefun:{logical}"
                      found=[]
                      for source in atlas.get("sources",[]):
                          if not isinstance(source,dict):
                              continue
                          if source.get("resource")==resource or source.get("sprite")==resource or source.get("sprite")==f"_slimefun:{logical}":
                              found.append(source)
                      matches[label]=found
                  report["atlases"][atlas_path]=matches

              # Check whether direct and alias sprite IDs have physical files.
              report["texture_files"]={}
              for label, logical in MODELS.items():
                  direct=f"assets/slimefun/textures/{logical}.png"
                  alias=f"assets/_slimefun/textures/{logical}.png"
                  report["texture_files"][label]={
                      "direct": direct in names,
                      "alias": alias in names,
                      "direct_path": direct,
                      "alias_path": alias,
                  }

          with open("diagnostics/talisman-effective-26_3.json","w",encoding="utf-8") as f:
              json.dump(report,f,indent=2,sort_keys=True)
              f.write("\n")
          PY

      - name: Analyze actual talisman PNG pixels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pillow
          python - <<'PY'
          import json, zipfile
          from collections import Counter
          from io import BytesIO
          from PIL import Image

          names = ["miner","knight","caveman","wise","farmer"]
          with zipfile.ZipFile("pack.zip") as zf:
              out={}
              for name in names:
                  path=f"assets/slimefun/textures/slimefun/talisman1/{name}.png"
                  im=Image.open(BytesIO(zf.read(path))).convert("RGBA")
                  colors=Counter(im.getdata())
                  out[name]={
                      "size": list(im.size),
                      "unique_colors": len(colors),
                      "top_colors": [
                          {"rgba": list(rgba), "count": count}
                          for rgba,count in colors.most_common(12)
                      ],
                      "magenta_pixels": sum(c for rgba,c in colors.items() if rgba[:3] in ((255,0,255),(248,0,248))),
                      "black_pixels": sum(c for rgba,c in colors.items() if rgba[:3] == (0,0,0) and rgba[3] > 0),
                  }
          with open("diagnostics/talisman-png-colors.json","w",encoding="utf-8") as f:
              json.dump(out,f,indent=2,sort_keys=True)
              f.write("\n")
          PY

      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/talisman-effective-26_3.json diagnostics/talisman-png-colors.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diagnostics: inspect talisman texture pixels [skip ci]"
          git push
