name: Diagnose talisman resource-pack mappings

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-talisman-pack.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download published pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/wickidcow/SFL_RP_Official/releases/download/v3.0.0/SlimefunLegacyRP.zip" \
            --output pack.zip
          unzip -tq pack.zip

      - name: Trace talisman model and atlas graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python - <<'PY'
          import json, zipfile
          from pathlib import PurePosixPath

          TARGETS = {
              "COMMON_TALISMAN": 2200164,
              "ANVIL_TALISMAN": 2200165,
              "MINER_TALISMAN": 2200167,
              "HUNTER_TALISMAN": 2200169,
              "LAVA_TALISMAN": 2200171,
              "WATER_TALISMAN": 2200173,
              "ANGEL_TALISMAN": 2200175,
              "FIRE_TALISMAN": 2200177,
              "MAGICIAN_TALISMAN": 2200179,
              "TRAVELLER_TALISMAN": 2200181,
              "WARRIOR_TALISMAN": 2200183,
              "KNIGHT_TALISMAN": 2200185,
              "WHIRLWIND_TALISMAN": 2200193,
              "WIZARD_TALISMAN": 2200195,
              "CAVEMAN_TALISMAN": 2200529,
              "WISE_TALISMAN": 2200531,
              "FARMER_TALISMAN": 2200545,
          }

          def load_json(zf, name):
              try:
                  return json.loads(zf.read(name).decode("utf-8"))
              except Exception:
                  return None

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for v in obj.values():
                      yield from walk(v)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from walk(v)

          def locate(zf, suffix):
              return [n for n in zf.namelist() if n.endswith(suffix)]

          def ref_for_threshold(itemdef, threshold):
              if not isinstance(itemdef, dict):
                  return None
              for node in walk(itemdef):
                  entries = node.get("entries")
                  if not isinstance(entries, list):
                      continue
                  for entry in entries:
                      if not isinstance(entry, dict):
                          continue
                      try:
                          value = float(entry.get("threshold"))
                      except (TypeError, ValueError):
                          continue
                      if value != float(threshold):
                          continue
                      model = entry.get("model")
                      if isinstance(model, dict):
                          return model.get("model")
                      if isinstance(model, str):
                          return model
              return None

          def model_path(ref):
              if not isinstance(ref, str):
                  return None
              ns, path = ref.split(":", 1) if ":" in ref else ("minecraft", ref)
              return f"assets/{ns}/models/{path}.json"

          def texture_refs(model, current_ns):
              out = []
              for node in walk(model):
                  textures = node.get("textures")
                  if not isinstance(textures, dict):
                      continue
                  for value in textures.values():
                      if not isinstance(value, str) or value.startswith("#"):
                          continue
                      ns, path = value.split(":", 1) if ":" in value else (current_ns, value)
                      out.append({
                          "ref": value,
                          "namespace": ns,
                          "logical_path": path,
                          "file": f"assets/{ns}/textures/{path}.png",
                      })
              return out

          def relevant_atlas_sources(obj):
              matches = []
              if not isinstance(obj, dict):
                  return matches
              for source in obj.get("sources", []):
                  if not isinstance(source, dict):
                      continue
                  text = json.dumps(source, sort_keys=True)
                  if "slimefun" in text.lower() or "talisman" in text.lower():
                      matches.append(source)
              return matches

          report = {}
          with zipfile.ZipFile("pack.zip") as zf:
              names = set(zf.namelist())
              report["entry_count"] = len(names)
              report["pack_mcmeta"] = load_json(zf, "pack.mcmeta")
              report["emerald_itemdefs"] = locate(zf, "assets/minecraft/items/emerald.json")
              report["items_atlases"] = {}
              for path in locate(zf, "assets/minecraft/atlases/items.json"):
                  obj = load_json(zf, path)
                  report["items_atlases"][path] = {
                      "all_sources": obj.get("sources", []) if isinstance(obj, dict) else None,
                      "slimefun_or_talisman_sources": relevant_atlas_sources(obj),
                  }

              report["targets"] = {}
              for item_id, threshold in TARGETS.items():
                  matches = []
                  for idef in report["emerald_itemdefs"]:
                      obj = load_json(zf, idef)
                      ref = ref_for_threshold(obj, threshold)
                      if not ref:
                          continue
                      mp = model_path(ref)
                      rec = {
                          "itemdef": idef,
                          "threshold": threshold,
                          "model_ref": ref,
                          "model_file": mp,
                          "model_exists": mp in names if mp else False,
                      }
                      if mp in names:
                          mo = load_json(zf, mp)
                          ns = mp.split("/", 2)[1]
                          textures = texture_refs(mo, ns)
                          for tex in textures:
                              tex["exists"] = tex["file"] in names
                              # Is this texture under the default item-atlas directory?
                              tex["under_default_item_dir"] = tex["logical_path"].startswith("item/")
                          rec["textures"] = textures
                      matches.append(rec)
                  report["targets"][item_id] = matches

          with open("diagnostics/talisman-pack-report.json", "w", encoding="utf-8") as fh:
              json.dump(report, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/talisman-pack-report.json
          if git diff --cached --quiet; then
            echo "Diagnostic report unchanged."
            exit 0
          fi
          git commit -m "diagnostics: inspect talisman atlas coverage [skip ci]"
          git push
