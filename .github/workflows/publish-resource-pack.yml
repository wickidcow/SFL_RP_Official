name: Publish Slimefun + Pylon + IAWeapons Pack

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 3.0.1). Leave blank to use VERSION."
        required: false
        type: string
      slimefun_source_url:
        description: "Source full Slimefun/IAWeapons pack"
        required: false
        default: "https://github.com/wickidcow/SFL_RP_Official/releases/download/v1.0.1/SlimefunLegacyRP.zip"
        type: string
      pylon_source_url:
        description: "Official Pylon resource-pack ZIP"
        required: false
        default: "https://github.com/pylonmc/pylon-resource-pack/releases/download/v0.7.1/PylonPack.zip"
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish combined resource pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release settings
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SF_URL: ${{ inputs.slimefun_source_url }}
          INPUT_PYLON_URL: ${{ inputs.pylon_source_url }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          SF_URL="${INPUT_SF_URL:-}"
          if [ -z "$SF_URL" ]; then
            SF_URL="https://github.com/wickidcow/SFL_RP_Official/releases/download/v1.0.1/SlimefunLegacyRP.zip"
          fi

          PYLON_URL="${INPUT_PYLON_URL:-}"
          if [ -z "$PYLON_URL" ]; then
            PYLON_URL="https://github.com/pylonmc/pylon-resource-pack/releases/download/v0.7.1/PylonPack.zip"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "sf_url=$SF_URL" >> "$GITHUB_OUTPUT"
          echo "pylon_url=$PYLON_URL" >> "$GITHUB_OUTPUT"

      - name: Download Slimefun/IAWeapons source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "${{ steps.release.outputs.sf_url }}"             --output slimefun-source.zip

      - name: Download official Pylon pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "${{ steps.release.outputs.pylon_url }}"             --output pylon-source.zip

      - name: Build combined pack
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_combined_pack.py             slimefun-source.zip             pylon-source.zip             SlimefunLegacyRP.zip

      - name: Validate release ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t SlimefunLegacyRP.zip
          unzip -l SlimefunLegacyRP.zip | grep -q "assets/slimefun/"
          unzip -l SlimefunLegacyRP.zip | grep -q "assets/pylon/"
          unzip -l SlimefunLegacyRP.zip | grep -q "assets/iaweapons/"
          unzip -l SlimefunLegacyRP.zip | grep -q "assets/minecraft/items/player_head.json"

          if unzip -l SlimefunLegacyRP.zip | grep -Eq "assets/(rebar|rebarmobs|supreme|infinityexpansion|fluffymachines|cultivation|exotic_garden|gastronomicon)/"; then
            echo "Unexpected removed addon namespace found" >&2
            exit 1
          fi

          sha1sum SlimefunLegacyRP.zip
          sha256sum SlimefunLegacyRP.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          NOTES="Slimefun Legacy Resource Pack $VERSION

          Combined clean pack for Minecraft Java 1.21.11+ containing:
          - Slimefun Legacy core models/textures
          - Pylon models/textures
          - IAWeapons models/textures/sounds
          - required modern item definitions and atlases
          - preserved player-head/skull special fallbacks
          - purple Slimefun resource-pack icon

          The build merges Slimefun/IAWeapons numeric CustomModelData with Pylon string CustomModelData so the three systems can share vanilla carrier items safely.

          Removed unrelated addon/resource-pack namespaces.

          Player download asset: SlimefunLegacyRP.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SlimefunLegacyRP.zip --clobber
          else
            gh release create "$TAG" SlimefunLegacyRP.zip               --title "Slimefun Legacy Resource Pack $TAG"               --notes "$NOTES"               --latest
          fi

      - name: Show stable player URL
        shell: bash
        run: |
          echo "https://github.com/${{ github.repository }}/releases/latest/download/SlimefunLegacyRP.zip"
