name: Publish Slimefun Legacy Resource Pack

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Actions run ID containing the exact tested resource-pack artifact"
        required: false
        type: string
      artifact_name:
        description: "Artifact name from that run"
        required: false
        default: "SlimefunLegacyRP"
        type: string
      source_url:
        description: "Alternative URL of the exact tested SlimefunLegacyRP.zip"
        required: false
        type: string
      source_sha256:
        description: "Exact SHA-256 of the tested ZIP"
        required: true
        type: string
      version:
        description: "Release version without v"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish exact tested candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate request
        id: release
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [[ ! "$SOURCE_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "A valid tested SHA-256 is required." >&2
            exit 1
          fi

          if [[ -n "$BUILD_RUN_ID" && -n "$SOURCE_URL" ]]; then
            echo "Specify build_run_id or source_url, not both." >&2
            exit 1
          fi

          if [[ -z "$BUILD_RUN_ID" && -z "$SOURCE_URL" ]]; then
            echo "Specify build_run_id or source_url." >&2
            exit 1
          fi

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download exact tested Actions artifact
        if: inputs.build_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "${{ inputs.build_run_id }}" --repo "$GITHUB_REPOSITORY" --name "${{ inputs.artifact_name }}" --dir candidate
          test -f candidate/SlimefunLegacyRP.zip
          cp candidate/SlimefunLegacyRP.zip SlimefunLegacyRP.zip

      - name: Download exact tested URL candidate
        if: inputs.source_url != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "${{ inputs.source_url }}" --output SlimefunLegacyRP.zip

      - name: Verify exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ inputs.source_sha256 }}  SlimefunLegacyRP.zip" | sha256sum --check -
          python tools/validate_pack.py SlimefunLegacyRP.zip --sha256 "${{ inputs.source_sha256 }}"

      - name: Publish release unchanged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ inputs.version }}
          SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail

          {
            echo "Slimefun Legacy Resource Pack $VERSION"
            echo
            echo "Tested combined resource pack for Minecraft Java 1.21.11 through 26.3."
            echo
            echo "This release publishes the exact in-game-tested candidate unchanged as SlimefunLegacyRP.zip."
            echo
            echo "SHA-256:"
            echo "$SHA256"
            echo
            echo "Permanent player URL:"
            echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/SlimefunLegacyRP.zip"
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SlimefunLegacyRP.zip --clobber
            gh release edit "$TAG" --title "Slimefun Legacy Resource Pack $TAG" --notes-file release-notes.md --latest
          else
            gh release create "$TAG" SlimefunLegacyRP.zip --title "Slimefun Legacy Resource Pack $TAG" --notes-file release-notes.md --latest
          fi

      - name: Verify published asset checksum
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/SlimefunLegacyRP.zip"
          curl --fail --location --retry 3 "$URL" --output published.zip
          echo "${{ inputs.source_sha256 }}  published.zip" | sha256sum --check -
