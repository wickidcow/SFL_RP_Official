name: Publish IAWeapons Resource Pack

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 2.0.1). Leave blank to use VERSION."
        required: false
        type: string
      source_url:
        description: "Full source pack ZIP to trim down to IAWeapons"
        required: false
        default: "https://github.com/wickidcow/SFL_RP_Official/releases/download/v1.0.1/SlimefunLegacyRP.zip"
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish IAWeapons-only pack
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release settings
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail

          VERSION="${INPUT_VERSION:-}"
          if [ -z "$VERSION" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          SOURCE_URL="${INPUT_SOURCE_URL:-}"
          if [ -z "$SOURCE_URL" ]; then
            SOURCE_URL="https://github.com/wickidcow/SFL_RP_Official/releases/download/v1.0.1/SlimefunLegacyRP.zip"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"

      - name: Download source pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "${{ steps.release.outputs.source_url }}"             --output source-pack.zip

      - name: Build clean IAWeapons pack
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_iaweapons_pack.py source-pack.zip SFL_IAWeaponsRP.zip

      - name: Validate release ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t SFL_IAWeaponsRP.zip
          unzip -l SFL_IAWeaponsRP.zip | grep -q "pack.mcmeta"
          unzip -l SFL_IAWeaponsRP.zip | grep -q "pack.png"
          unzip -l SFL_IAWeaponsRP.zip | grep -q "assets/iaweapons/"
          if unzip -l SFL_IAWeaponsRP.zip | grep -Eq "assets/(slimefun|pylon|rebar|rebarmobs|infinityexpansion|supreme|fluffymachines)/"; then
            echo "Unexpected non-IAWeapons addon namespace found in release pack" >&2
            exit 1
          fi
          sha1sum SFL_IAWeaponsRP.zip
          sha256sum SFL_IAWeaponsRP.zip

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          NOTES="SFL IAWeapons Resource Pack $VERSION

          Clean IAWeapons-only rebuild for Minecraft Java 1.21.11+.

          Contains:
          - IAWeapons models, textures and sounds
          - required crossbow, golden_sword, snowball and stick item definitions
          - IAWeapons firework-launcher helper models
          - minimal modern item atlas
          - updated purple Slimefun pack icon

          Removed:
          - Slimefun core textures
          - Pylon / Rebar / RebarMobs
          - InfinityExpansion / Supreme / other addon assets
          - unrelated ItemsAdder/ModelEngine content

          Validated through the current 26.3 resource-pack structure.

          Player download asset: SFL_IAWeaponsRP.zip"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SFL_IAWeaponsRP.zip --clobber
          else
            gh release create "$TAG" SFL_IAWeaponsRP.zip               --title "SFL IAWeapons Resource Pack $TAG"               --notes "$NOTES"               --latest
          fi

      - name: Show stable player URL
        shell: bash
        run: |
          echo "https://github.com/${{ github.repository }}/releases/latest/download/SFL_IAWeaponsRP.zip"
