name: Publish Slimefun Legacy Resource Pack

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Actions run ID containing the tested SlimefunLegacyRP artifact"
        required: false
        type: string
      source_url:
        description: "Alternative URL of the exact tested SlimefunLegacyRP.zip"
        required: false
        type: string
      source_sha256:
        description: "Exact SHA-256 of the tested ZIP"
        required: true
        type: string
      version:
        description: "Release version without v (blank = VERSION)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.release-request.json'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish exact tested candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release request
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RUN_ID: ${{ inputs.build_run_id }}
          INPUT_SOURCE_URL: ${{ inputs.source_url }}
          INPUT_SHA256: ${{ inputs.source_sha256 }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            eval "$(python - <<'PY'
          import json, shlex
          data = json.load(open(".release-request.json", encoding="utf-8"))
          for key in ("build_run_id", "source_url", "sha256", "version"):
              value = str(data.get(key, "") or "")
              print(f"{key.upper()}={shlex.quote(value)}")
          PY
          )"
          else
            BUILD_RUN_ID="${INPUT_RUN_ID:-}"
            SOURCE_URL="${INPUT_SOURCE_URL:-}"
            SHA256="${INPUT_SHA256:-}"
            VERSION="${INPUT_VERSION:-}"
          fi

          if [[ -z "${VERSION:-}" ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          if [[ -z "${SHA256:-}" ]]; then
            echo "A tested candidate SHA-256 is required." >&2
            exit 1
          fi

          if [[ -n "${BUILD_RUN_ID:-}" && -n "${SOURCE_URL:-}" ]]; then
            echo "Specify build_run_id or source_url, not both." >&2
            exit 1
          fi

          if [[ -z "${BUILD_RUN_ID:-}" && -z "${SOURCE_URL:-}" ]]; then
            echo "Specify build_run_id or source_url." >&2
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_run_id=${BUILD_RUN_ID:-}" >> "$GITHUB_OUTPUT"
          echo "source_url=${SOURCE_URL:-}" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Download tested Actions artifact
        if: steps.release.outputs.build_run_id != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.release.outputs.build_run_id }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name SlimefunLegacyRP \
            --dir candidate
          test -f candidate/SlimefunLegacyRP.zip
          cp candidate/SlimefunLegacyRP.zip SlimefunLegacyRP.zip

      - name: Download tested URL candidate
        if: steps.release.outputs.source_url != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "${{ steps.release.outputs.source_url }}" \
            --output SlimefunLegacyRP.zip

      - name: Verify checksum and regression guards
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_pack.py \
            SlimefunLegacyRP.zip \
            --sha256 "${{ steps.release.outputs.sha256 }}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
Slimefun Legacy Resource Pack $VERSION

Tested combined resource pack for Minecraft Java 1.21.11 through 26.3.

Includes Slimefun Legacy/addon assets, Pylon/Rebar/RebarMobs, Magic, MMOItems,
IAWeapons/Slimefun Warfare support, MC Icons, and ore overrides.

The release workflow publishes the exact tested candidate unchanged as
SlimefunLegacyRP.zip.

SHA-256:
${{ steps.release.outputs.sha256 }}

Permanent player URL:
https://github.com/${{ github.repository }}/releases/latest/download/SlimefunLegacyRP.zip
EOF
)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SlimefunLegacyRP.zip --clobber
            gh release edit "$TAG" \
              --title "Slimefun Legacy Resource Pack $TAG" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" SlimefunLegacyRP.zip \
              --title "Slimefun Legacy Resource Pack $TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Verify permanent latest asset
        shell: bash
        env:
          EXPECTED_SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/latest/download/SlimefunLegacyRP.zip"
          curl --fail --location --retry 3 "$URL" --output published.zip
          echo "$EXPECTED_SHA256  published.zip" | sha256sum --check -
          echo "$URL"
