name: Publish Slimefun Legacy Resource Pack

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "URL of the tested SlimefunLegacyRP.zip candidate"
        required: true
        type: string
      source_sha256:
        description: "Exact SHA-256 of the tested candidate"
        required: true
        type: string
      version:
        description: "Release version without v (blank = VERSION)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Validate and publish exact tested ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION:-}"
          if [[ -z "$VERSION" ]]; then
            VERSION="$(tr -d '[:space:]' < VERSION)"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download exact tested candidate
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "${{ inputs.source_url }}" \
            --output SlimefunLegacyRP.zip

      - name: Verify checksum and resource-pack invariants
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_pack.py \
            SlimefunLegacyRP.zip \
            --sha256 "${{ inputs.source_sha256 }}"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          NOTES="$(cat <<EOF
Slimefun Legacy Resource Pack $VERSION

Tested combined resource pack for Minecraft Java 1.21.11 through 26.3.

Includes Slimefun Legacy/addon assets, Pylon/Rebar/RebarMobs, Magic, MMOItems, IAWeapons/Slimefun Warfare support, MC Icons, and ore overrides.

This workflow publishes the validated candidate unchanged as:
SlimefunLegacyRP.zip

Permanent player URL:
https://github.com/${{ github.repository }}/releases/latest/download/SlimefunLegacyRP.zip
EOF
)"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" SlimefunLegacyRP.zip --clobber
            gh release edit "$TAG" \
              --title "Slimefun Legacy Resource Pack $TAG" \
              --notes "$NOTES" \
              --latest
          else
            gh release create "$TAG" SlimefunLegacyRP.zip \
              --title "Slimefun Legacy Resource Pack $TAG" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Verify permanent latest asset
        shell: bash
        env:
          EXPECTED_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          URL="https://github.com/${{ github.repository }}/releases/latest/download/SlimefunLegacyRP.zip"
          curl --fail --location --retry 3 "$URL" --output published.zip
          echo "$EXPECTED_SHA256  published.zip" | sha256sum --check -
          echo "$URL"
