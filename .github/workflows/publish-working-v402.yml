name: Publish recovered working RP v4.0.2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-working-v402.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish owner-confirmed working structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download exact recovered candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download 37661937590 \
            --repo "$GITHUB_REPOSITORY" \
            --name SlimefunLegacyRP-RecoveredWorking \
            --dir candidate
          cp candidate/SlimefunLegacyRP.zip SlimefunLegacyRP.zip
          echo "b5aa3859764a5d0d11007af4cfc7d7b239ae8316c27db9ab2fe8edd8c0842740  SlimefunLegacyRP.zip" | sha256sum --check -

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq SlimefunLegacyRP.zip
          python tools/validate_pack.py \
            SlimefunLegacyRP.zip \
            --sha256 b5aa3859764a5d0d11007af4cfc7d7b239ae8316c27db9ab2fe8edd8c0842740

          python - <<'PY'
          import json, zipfile

          with zipfile.ZipFile("SlimefunLegacyRP.zip") as zf:
              names=set(zf.namelist())
              meta=json.loads(zf.read("pack.mcmeta"))
              expected=[{"directory":"sfl_26_1_plus","min_format":84,"max_format":9999}]
              if meta.get("overlays",{}).get("entries") != expected:
                  raise SystemExit("working overlay layout was not preserved")

              oak=json.loads(zf.read("assets/minecraft/items/oak_planks.json"))
              if oak["model"]["fallback"].get("model") != "minecraft:block/oak_planks":
                  raise SystemExit("oak planks no longer use the working 3D block fallback")

              for name in (
                  "wooden_hoe","leather_chestplate","leather_leggings","chainmail_chestplate",
                  "iron_helmet","iron_chestplate","golden_leggings","diamond_chestplate",
                  "netherite_chestplate","chest","compass","clock","trident","crossbow"
              ):
                  path=f"assets/minecraft/items/{name}.json"
                  if path not in names:
                      raise SystemExit(f"working carrier definition missing: {path}")

              for tier in ("talisman1","talisman2"):
                  for item in ("farmer","caveman","wise"):
                      model=f"assets/slimefun/models/item/slimefun/{tier}/{item}.json"
                      data=json.loads(zf.read(model))
                      texture=data.get("textures",{}).get("layer0")
                      expected_texture=f"slimefun:item/slimefun/{tier}/{item}"
                      if texture != expected_texture:
                          raise SystemExit(f"{model}: {texture!r} != {expected_texture!r}")
                      ns, rel=texture.split(":",1)
                      png=f"assets/{ns}/textures/{rel}.png"
                      if png not in names:
                          raise SystemExit(f"missing talisman texture: {png}")
          PY

      - name: Publish v4.0.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Slimefun Legacy Official Resource Pack 4.0.2

          This release restores the owner-confirmed working resource-pack generation
          structure instead of using the older v3/ItemsAdder-overlay layout.

          The working reference supplied by the server owner is the historical
          approved v4 baseline:
          SHA-256 1ad615e5a9bd6117e5010255601ddb44451c1ce124fa17c39d376617f775cdb8

          The published v4.0.2 ZIP is deterministically recovered from the reviewed
          v4.1 identity preview by removing only its 295 client-side identity wrappers.
          The original selector trees are restored and regression-checked against the
          working reference for the reported carrier items.

          Restored/guarded behavior includes:
          - wooden hoe
          - leather, chainmail, iron, gold, diamond and netherite armor carriers
          - chest, compass, clock, trident and crossbow
          - oak planks using the 3D block-model fallback
          - Farmer, Caveman and Wise talismans plus their Ender variants

          The old ia_overlay_* / albion_26_3 generated overlay chain is not used by
          this working structure. The pack retains the single reviewed sfl_26_1_plus
          overlay used by the owner-confirmed pack.

          Minecraft Java: 1.21.11 through 26.3
          SHA-256: b5aa3859764a5d0d11007af4cfc7d7b239ae8316c27db9ab2fe8edd8c0842740

          Permanent player download:
          https://github.com/wickidcow/SFL_RP_Official/releases/latest/download/SlimefunLegacyRP.zip
          EOF

          gh release create v4.0.2 SlimefunLegacyRP.zip \
            --title "Slimefun Legacy Resource Pack v4.0.2" \
            --notes-file notes.md \
            --latest

      - name: Verify published bytes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/wickidcow/SFL_RP_Official/releases/download/v4.0.2/SlimefunLegacyRP.zip" \
            --output published.zip
          echo "b5aa3859764a5d0d11007af4cfc7d7b239ae8316c27db9ab2fe8edd8c0842740  published.zip" | sha256sum --check -

      - name: Pin v4.0.2 as generator baseline
        shell: bash
        run: |
          set -euo pipefail
          SHA1="$(sha1sum SlimefunLegacyRP.zip | awk '{print $1}')"
          python - "$SHA1" <<'PY'
          import json, sys
          from pathlib import Path

          data={
              "version":"4.0.2",
              "filename":"SlimefunLegacyRP.zip",
              "url":"https://github.com/wickidcow/SFL_RP_Official/releases/download/v4.0.2/SlimefunLegacyRP.zip",
              "sha1":sys.argv[1],
              "sha256":"b5aa3859764a5d0d11007af4cfc7d7b239ae8316c27db9ab2fe8edd8c0842740",
              "notes":"Recovered owner-confirmed working generation structure. Carrier/armor/oak-planks/talisman regressions are guarded; replaces v3-derived v4.0.0/v4.0.1 experiments."
          }
          Path("BASELINE.json").write_text(json.dumps(data,indent=2)+"\n",encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BASELINE.json
          git commit -m "release: pin recovered working RP v4.0.2 [skip ci]"
          git push
