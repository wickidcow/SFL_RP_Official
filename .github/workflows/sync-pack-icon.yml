name: Sync approved pack icon

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-pack-icon.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract approved icon
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o rp.zip https://github.com/wickidcow/SFL_RP_Official/releases/download/v4.0.1/SlimefunLegacyRP.zip
          echo '1b856fff90fe78b7d5964a86a8ed281517d073a082db485d73f31cd07aa64a83  rp.zip' | sha256sum --check -
          python -c "import zipfile; z=zipfile.ZipFile('rp.zip'); open('pack.png','wb').write(z.read('pack.png'))"
          echo '07ce5f676801f86eeb61681fe72a9d0c5938941b8524b9e7a56b407ea8c17539  pack.png' | sha256sum --check -
      - name: Commit root pack.png
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pack.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: sync approved pack icon [skip ci]'
            git push
          fi